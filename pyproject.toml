[project]
name = "pgradda"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cartopy>=0.25.0",
    "dask>=2026.8.0",
    "f90nml>=1.5",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "torch==2.14.0",
    "xarray>=2026.7.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
